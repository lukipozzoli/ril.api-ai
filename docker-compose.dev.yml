services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - ~/.config/gcloud:/root/.config/gcloud:ro
    ports:
      - "8080:8080"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - APP_ENV=local
      - GIN_MODE=release
      - DATABASE_AGENT_DSN=host=postgres-local user=postgres password=postgres dbname=rilia_local port=5432 sslmode=disable TimeZone=UTC
    networks:
      - ril_network
      - go_app
    depends_on:
      - redis
      - postgres-local
      - jaeger
  mcp-toolbox:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:latest
    user: root
    hostname: toolbox
    working_dir: /app
    ports:
      - "5003:5000"
    volumes:
      - .:/app
      - ~/.config/gcloud:/root/.config/gcloud:ro
    command: >
      --tools-file /app/tools-dev.yaml
      --address 0.0.0.0
    networks:
      - go_app
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8090:8090"
    command: go run ./cmd/sandbox/ web -port 8090 -write-timeout 3m api webui -api_server_address http://localhost:8090/api
    volumes:
      - .:/app
      - ~/.config/gcloud:/root/.config/gcloud:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - APP_ENV=local
      - DATABASE_AGENT_DSN=host=postgres-local user=postgres password=postgres dbname=rilia_local port=5432 sslmode=disable TimeZone=UTC
    networks:
      - go_app
    depends_on:
      - redis
      - postgres-local
  redis:
    image: redis:alpine
    networks:
      - go_app
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    command: [ "redis-server", "--save", "60", "1", "--appendonly", "yes" ]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"   # UI web
      - "4318:4318"     # OTLP/HTTP (receptor de traces)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - go_app
  postgres-local:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rilia_local
    ports:
      - "5433:5432"
    volumes:
      - pg-local-data:/var/lib/postgresql/data
    networks:
      - go_app
networks:
  ril_network:
    external: true
  go_app:
    driver: bridge
volumes:
  redis-data:
    driver: local
  pg-local-data:
    driver: local
