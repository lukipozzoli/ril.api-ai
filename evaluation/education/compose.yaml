name: ril-education-evaluation
services:
  phoenix:
    image: arizephoenix/phoenix:${PHOENIX_VERSION:-latest}
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"
    environment:
      PHOENIX_WORKING_DIR: /data
      PHOENIX_HOST: 0.0.0.0
    volumes:
      - phoenix-data:/data
    restart: unless-stopped
volumes:
  phoenix-data:
